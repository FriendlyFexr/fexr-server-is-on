    // Audio FX using Web Audio API (Synthesized Cyber Sounds)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playBeep(freq = 440, duration = 0.08, type = 'sine') {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playAlertChime(isOnline) {
      if (isOnline) {
        playBeep(523.25, 0.08, 'sine');
        setTimeout(() => playBeep(659.25, 0.08, 'sine'), 90);
        setTimeout(() => playBeep(1046.50, 0.2, 'triangle'), 180);
      } else {
        playBeep(440, 0.08, 'sawtooth');
        setTimeout(() => playBeep(349.23, 0.08, 'sawtooth'), 90);
        setTimeout(() => playBeep(220.00, 0.25, 'sawtooth'), 180);
      }
    }

    function showStatusToast(newState) {
      const toastContainer = document.getElementById('toastContainer');
      if (!toastContainer) return;

      const toast = document.createElement('div');
      const isOnline = newState === 'ONLINE';
      
      toast.className = `transform translate-x-full opacity-0 transition-all duration-500 ease-out flex items-center gap-3 px-5 py-3.5 rounded-xl border-2 backdrop-blur-xl shadow-2xl ${

          ? 'bg-emerald-950/90 border-emerald-500/80 text-emerald-300 box-glow-yes' 
          : 'bg-rose-950/90 border-rose-500/80 text-rose-300 box-glow-no'
      }`;

      toast.innerHTML = `
        <div class="p-2 rounded-lg ${isOnline ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'}">

        </div>
        <div>
          <div class="font-orbitron font-extrabold text-xs tracking-wider uppercase">GLOBAL SIGNAL BROADCAST</div>
          <div class="font-orbitron font-black text-sm tracking-widest text-white">STATUS CHANGED TO: ${newState}</div>
        </div>
      `;

      toastContainer.appendChild(toast);

      // Trigger animation in
      requestAnimationFrame(() => {
        toast.classList.remove('translate-x-full', 'opacity-0');
      });

      // Sound feedback
      playAlertChime(isOnline);

      // Auto remove toast
      setTimeout(() => {
        toast.classList.add('translate-x-full', 'opacity-0');
        setTimeout(() => toast.remove(), 500);
      }, 4000);
    }

    // Realtime Listener
    function setupRealtimeListener() {
      if (!db) return;
      
      const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'globalState', 'current');
      
      // Firestore onSnapshot guarantees instant real-time pushes to all open clients
      onSnapshot(docRef, (docSnap) => {
        if (docSnap.exists()) {
          const data = docSnap.data();
          if (data && data.state) {
            let mappedState = data.state;
            if (mappedState === 'YES') mappedState = 'ONLINE';
            if (mappedState === 'NO') mappedState = 'OFFLINE';

            // Show toast & chime if state changes during a active session
            if (!isInitialLoad && currentGlobalStateVal !== mappedState) {
              showStatusToast(mappedState);
            }

            currentGlobalStateVal = mappedState;
            isInitialLoad = false;
            updateUI(mappedState, data.updatedAt);
          }
        } else {
          // Initialize state if not present
          setGlobalState('ONLINE');
        }
      }, (error) => {
        console.error("Firestore Listener Error:", error);
      });
    }

    // Function to push state update
    window.setGlobalState = async function(newState) {
      const timestamp = new Date().toISOString();

      if (db && currentUser) {
        try {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'globalState', 'current');
          await setDoc(docRef, {
            state: newState,
            updatedAt: timestamp,
            updatedBy: currentUser.uid
          });
        } catch (err) {
          console.error("Failed to write state to Firestore:", err);
        }
      } else {
        // Fallback for standalone HTML execution
        if (currentGlobalStateVal !== newState) {
          showStatusToast(newState);
        }
        currentGlobalStateVal = newState;
        localGlobalState.state = newState;
        localGlobalState.updatedAt = timestamp;
        updateUI(newState, timestamp);
      }

      // Close modal after selection
      toggleAdminModal(false);
    };

    // Secret Key Code Detection Engine (Passcode: 191012)
    let passcodeBuffer = "";
    const SECRET_CODE = "191012";
    let passcodeTimeout = null;

    function handlePasscodeKey(key) {
      const displayEl = document.getElementById('passcodeDisplay');
      const dotsEl = document.getElementById('passcodeDots');
      
      // Handle backspace or delete key to reset code
      if (key === 'Backspace' || key === 'Delete' || key === 'Del') {
        passcodeBuffer = "";
        if (displayEl) displayEl.classList.add('hidden');
        if (dotsEl) dotsEl.innerHTML = "";
        return;
      }

      // Allow numeric keys
      if (/^[0-9]$/.test(key)) {
        passcodeBuffer += key;

        // Visual feedback dots
        if (displayEl) displayEl.classList.remove('hidden');
        if (dotsEl) {
          dotsEl.innerHTML = passcodeBuffer
            .split('')
            .map(() => '<span class="inline-block w-3 h-3 bg-cyan-400 rounded-full animate-ping box-glow-yes"></span>')
            .join('');
        }

        playBeep(800 + passcodeBuffer.length * 100, 0.05, 'sine');

        // Clear timer on new keypress
        clearTimeout(passcodeTimeout);
        passcodeTimeout = setTimeout(() => {
          passcodeBuffer = "";
          if (displayEl) displayEl.classList.add('hidden');
          if (dotsEl) dotsEl.innerHTML = "";
        }, 3000);

        // Check if passcode matches
        if (passcodeBuffer === SECRET_CODE) {
          playUnlockSound();
          toggleAdminModal(true);
          passcodeBuffer = "";
          if (displayEl) displayEl.classList.add('hidden');
          if (dotsEl) dotsEl.innerHTML = "";
        }
      }
    }

    window.addEventListener('keydown', (e) => {
      // Don't capture keyboard shortcuts if user is typing in input fields
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      handlePasscodeKey(e.key);

        setTimeout(() => {
          modal.classList.add('hidden');
        }, 300);
      }
    };

    document.getElementById('adminModal')?.addEventListener('click', (e) => {
      if (e.target.id === 'adminModal') {
        toggleAdminModal(false);
      }
    });

    // Initialize application on page load
    initFirebase();
